<text x="401.0" y="133" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">+4.5% colour</text>
<text x="262" y="181" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local structure</text>
