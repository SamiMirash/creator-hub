<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384">
<rect width="900" height="384" fill="#0f1216"/>
<text x="28" y="42" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Colour strength repaints the game and adds nothing</text>
<text x="28" y="70" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">How far each control moves the frame's hue off Returnal's own palette.</text>
<line x1="300" y1="92" x2="300" y2="350" stroke="#2a3038" stroke-width="1"/>
<text x="250" y="128" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Detail strength</text>
<rect x="300.0" y="112" width="90.7" height="22" rx="3" fill="#7fd1a8"/>
<text x="402.7" y="128" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">+4.5% colour</text>
<text x="250" y="174" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local structure</text>
<rect x="277.6" y="158" width="22.4" height="22" rx="3" fill="#7fd1a8"/>
<text x="312.0" y="174" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-1.1% colour</text>
<text x="250" y="220" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local tone</text>
<rect x="300.0" y="204" width="19.9" height="22" rx="3" fill="#7fd1a8"/>
<text x="331.9" y="220" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">+1.0% colour</text>
<text x="250" y="266" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Intensity</text>
<rect x="299.4" y="250" width="0.6" height="22" rx="3" fill="#7fd1a8"/>
<text x="312.0" y="266" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-0.0% colour</text>
<text x="250" y="312" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Colour strength 0→1</text>
<rect x="-110.0" y="296" width="410.0" height="22" rx="3" fill="#e2727d"/>
<text x="312.0" y="312" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-20.1% colour</text>
</svg>