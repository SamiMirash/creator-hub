<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384">
<rect width="900" height="384" fill="#0f1216"/>
<text x="28" y="42" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="22" font-weight="700">What each control is actually worth</text>
<text x="28" y="70" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">Detail lost when the control is halved from 2.0 to 1.0. Longer bar = the control was doing more.</text>
<line x1="300" y1="92" x2="300" y2="350" stroke="#2a3038" stroke-width="1"/>
<text x="250" y="128" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Detail strength</text>
<rect x="-110.0" y="112" width="410.0" height="22" rx="3" fill="#e2727d"/>
<text x="312.0" y="128" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-12.3% detail</text>
<text x="250" y="174" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local structure</text>
<rect x="-36.9" y="158" width="336.9" height="22" rx="3" fill="#e2727d"/>
<text x="312.0" y="174" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-10.1% detail</text>
<text x="250" y="220" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local tone</text>
<rect x="111.5" y="204" width="188.5" height="22" rx="3" fill="#e2727d"/>
<text x="312.0" y="220" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-5.7% detail</text>
<text x="250" y="266" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Intensity</text>
<rect x="173.6" y="250" width="126.4" height="22" rx="3" fill="#98a2ad"/>
<text x="312.0" y="266" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-3.8% detail</text>
<text x="250" y="312" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Colour strength 0→1</text>
<rect x="232.7" y="296" width="67.3" height="22" rx="3" fill="#98a2ad"/>
<text x="312.0" y="312" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-2.0% detail</text>
</svg>