<svg xmlns="http://www.w3.org/2000/svg" width="980" height="392" viewBox="0 0 980 392">
<rect width="980" height="392" fill="#0f1216"/>
<text x="28" y="44" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="23" font-weight="700">What each control is actually worth</text>
<text x="28" y="74" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">Detail lost when the control is halved from 2.0 to 1.0. Longer bar = the control was doing more.</text>
<line x1="278" y1="98" x2="278" y2="370" stroke="#2a3038" stroke-width="1"/>
<text x="262" y="133" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Detail strength</text>
<rect x="278" y="117" width="502.0" height="23" rx="3" fill="#e2727d"/>
<text x="792.0" y="133" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-12.3% detail</text>
<text x="262" y="181" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local structure</text>
<rect x="278" y="165" width="412.6" height="23" rx="3" fill="#e2727d"/>
<text x="702.6" y="181" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-10.1% detail</text>
<text x="262" y="229" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Local tone</text>
<rect x="278" y="213" width="230.8" height="23" rx="3" fill="#e2727d"/>
<text x="520.8" y="229" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-5.7% detail</text>
<text x="262" y="277" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Intensity</text>
<rect x="278" y="261" width="154.8" height="23" rx="3" fill="#98a2ad"/>
<text x="444.8" y="277" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-3.8% detail</text>
<text x="262" y="325" fill="#e8eaed" text-anchor="end" font-family="system-ui,sans-serif" font-size="15">Colour strength 0→1</text>
<rect x="278" y="309" width="82.5" height="23" rx="3" fill="#98a2ad"/>
<text x="372.5" y="325" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">-2.0% detail</text>
