<svg xmlns="http://www.w3.org/2000/svg" width="980" height="596" viewBox="0 0 980 596">
<rect width="980" height="596" fill="#0f1216"/>
<text x="28" y="44" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="23" font-weight="700">Base render rate with neural rendering off and on</text>
<text x="28" y="74" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">Real frames the engine draws. On screen both settings read 225.</text>
<text x="128.0" y="176.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="26" font-weight="700" text-anchor="end">2X</text>
<rect x="150" y="130.0" width="496.4" height="40" rx="3" fill="#2a3038"/>
<text x="160.0" y="156.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start">DLSS 5 off</text>
<text x="658.4" y="156.0" fill="#e8eaed" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" text-anchor="start">112.4 fps</text>
<rect x="150" y="186.0" width="278.2" height="40" rx="3" fill="#7fd1a8"/>
<text x="160.0" y="212.0" fill="#0f1216" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start">DLSS 5 on</text>
<text x="440.2" y="212.0" fill="#e8eaed" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" text-anchor="start">63.0 fps</text>
<text x="154.0" y="260.0" fill="#e2727d" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start">neural rendering costs 49 fps</text>
<text x="128.0" y="348.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="26" font-weight="700" text-anchor="end">4X</text>
<rect x="150" y="302.0" width="248.2" height="40" rx="3" fill="#2a3038"/>
<text x="160.0" y="328.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start">DLSS 5 off</text>
<text x="410.2" y="328.0" fill="#e8eaed" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" text-anchor="start">56.2 fps</text>
<rect x="150" y="358.0" width="248.2" height="40" rx="3" fill="#7fd1a8"/>
<text x="160.0" y="384.0" fill="#0f1216" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="start">DLSS 5 on</text>
<text x="410.2" y="384.0" fill="#e8eaed" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" text-anchor="start">56.2 fps</text>
<text x="154.0" y="432.0" fill="#7fd1a8" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start">it costs nothing at all</text>
<rect x="28.0" y="480.0" width="924.0" height="84.0" rx="6" fill="none" stroke="#7fd1a8" stroke-width="1.5"/>
<text x="490.0" y="514.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">A limit that binds at 2X and not at 4X is a GPU-time limit.</text>
<text x="490.0" y="542.0" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="middle">At 4X only 56 real frames are needed, so there is GPU left idle to absorb the neural pass.</text>
</svg>
