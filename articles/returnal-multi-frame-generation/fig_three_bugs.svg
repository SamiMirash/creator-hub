<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
<rect width="980" height="360" fill="#0f1216"/>
<text x="28" y="44" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="23" font-weight="700">What each fault looked like, and what it was</text>
<text x="28" y="74" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="14">The apparent symptom pointed at the wrong subsystem in all three cases.</text>
<text x="28.0" y="102.0" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start">APPARENT SYMPTOM</text>
<text x="430.0" y="102.0" fill="#7fd1a8" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start">ACTUAL CAUSE</text>
<line x1="28" y1="116" x2="952" y2="116" stroke="#2a3038" stroke-width="1"/>
<text x="28.0" y="150.0" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">Streamline is unsupported on this GPU</text>
<line x1="392.0" y1="145.0" x2="415.0" y2="145.0" stroke="#7fd1a8" stroke-width="2"/><polygon points="424.0,145.0 413.0,139.0 413.0,151.0" fill="#7fd1a8"/>
<text x="430.0" y="150.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">one inverted return value, passed straight through</text>
<line x1="28" y1="190" x2="952" y2="190" stroke="#2a3038" stroke-width="1"/>
<text x="28.0" y="224.0" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">frame generation is simply broken</text>
<line x1="392.0" y1="219.0" x2="415.0" y2="219.0" stroke="#7fd1a8" stroke-width="2"/><polygon points="424.0,219.0 413.0,213.0 413.0,225.0" fill="#7fd1a8"/>
<text x="430.0" y="218.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">Reflex markers dropped, and DLSS-G generates nothing without</text>
<text x="430.0" y="240.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">them</text>
<line x1="28" y1="264" x2="952" y2="264" stroke="#2a3038" stroke-width="1"/>
<text x="28.0" y="298.0" fill="#98a2ad" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">the process exited cleanly</text>
<line x1="392.0" y1="293.0" x2="415.0" y2="293.0" stroke="#7fd1a8" stroke-width="2"/><polygon points="424.0,293.0 413.0,287.0 413.0,299.0" fill="#7fd1a8"/>
<text x="430.0" y="292.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">a hook resolving to itself: a stack overflow, which a</text>
<text x="430.0" y="314.0" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="15" font-weight="400" text-anchor="start">debugger set to break on access violations never sees</text>
<line x1="28" y1="338" x2="952" y2="338" stroke="#2a3038" stroke-width="1"/>
</svg>
