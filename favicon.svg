<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SM">
  <!-- Sami Mirash channel mark. The glyphs are S and M.
       FIXED 2026-08-23: the previous artwork drew a capital B and a vertical bar, so every
       browser tab and every Google result showed "BI" while the aria-label claimed "SM".
       The label was right and the picture was wrong, which is exactly the pair nobody checks.
       Drawn as rectangles and one polygon rather than hand-written curves, so the shapes are
       verifiable by eye and cannot be subtly malformed. -->
  <defs>
    <linearGradient id="g" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5d79a"/>
      <stop offset="1" stop-color="#e2b566"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080705"/>
  <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#g)" stroke="#f2c879" stroke-opacity=".52"/>

  <!-- S : squared, five strokes -->
  <g fill="#080705">
    <rect x="11" y="19"   width="18"  height="5.4"/>
    <rect x="11" y="19"   width="5.4" height="16.2"/>
    <rect x="11" y="29.8" width="18"  height="5.4"/>
    <rect x="23.6" y="29.8" width="5.4" height="15.2"/>
    <rect x="11" y="39.6" width="18"  height="5.4"/>
  </g>

  <!-- M : single polygon, two stems and the centre V -->
  <polygon fill="#080705"
    points="34,45 34,19 39.4,19 43,29.6 46.6,19 52,19 52,45 46.9,45 46.9,29.8 44.4,36.6 41.6,36.6 39.1,29.8 39.1,45"/>
</svg>
