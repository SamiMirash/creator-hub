<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Edit your Sami Mirash member profile.">
  <meta property="og:title" content="Profile | Sami Mirash">
  <meta property="og:description" content="Save display name, handle, bio, and topic preferences.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.samimirash.com/profile.html">
  <meta property="og:image" content="https://www.samimirash.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.samimirash.com/og-image.png">
  <meta name="theme-color" content="#080705">
  <link rel="canonical" href="https://www.samimirash.com/profile.html">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <title>Profile | Sami Mirash</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfilePage","name":"Member profile","url":"https://www.samimirash.com/profile.html"}</script>
  <script defer src="assets/site.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="assets/seo.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" data-site-header></header>
  <main id="main">
    <section class="hero"><div class="wrap"><p class="eyebrow">Profile</p><h1>Keep your profile simple.</h1><p class="lede">Save a display name, handle, short bio, and topic preferences. Do not put sensitive personal details here.</p></div></section>
    <section class="section">
      <div class="wrap grid two">
        <article class="auth-panel">
          <h2>Profile settings</h2>
          <p class="status-text" data-auth-status></p>
          <p class="status-text" data-config-warning></p>
          <form class="auth-form" id="profile-form">
            <label>Display name<input name="display_name" autocomplete="name"></label>
            <label>Handle<input name="handle" autocomplete="nickname"></label>
            <label>Bio<textarea name="bio" rows="4"></textarea></label>
            <label>Favorite topics<textarea name="favorite_topics" rows="3"></textarea></label>
            <button class="button primary" type="submit">Save profile</button>
          </form>
        </article>
        <article class="card"><h2>Not logged in?</h2><p>You need a member session before saving profile details.</p><div class="button-row"><a class="button" href="login.html">Log in</a><a class="button ghost" href="join.html">Join free</a></div><button class="button ghost" type="button" data-logout>Log out</button></article>
      </div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
